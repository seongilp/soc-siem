[SERVICE]
    Flush         2
    Log_Level     info
    Parsers_File  /fluent-bit/etc/lab/parsers.conf

# --- 입력 -------------------------------------------------------------
[INPUT]
    Name            tail
    Tag             linux.auth
    Path            /logs/auth.log
    Parser          rsyslog
    DB              /state/auth.db
    Read_from_Head  On

[INPUT]
    Name            tail
    Tag             web.access
    Path            /logs/nginx/access.json
    Parser          nginx_json
    DB              /state/web.db
    Read_from_Head  On

# --- 정규화 -----------------------------------------------------------
# sshd 메시지에서 인증 결과/계정/출발지 IP를 뽑아낸다. 매칭 안 되는 줄은 그대로 통과.
[FILTER]
    Name          parser
    Match         linux.auth
    Key_Name      message
    Parser        sshd_auth
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name   modify
    Match  linux.auth
    Add    event_dataset linux.auth

[FILTER]
    Name   modify
    Match  web.access
    Add    event_dataset web.access
    Add    host target

# --- 출력 -------------------------------------------------------------
[OUTPUT]
    Name                opensearch
    Match               linux.auth
    Host                opensearch
    Port                9200
    HTTP_User           ${OS_USER}
    HTTP_Passwd         ${OS_PASSWORD}
    tls                 On
    tls.verify          Off
    Logstash_Format     On
    Logstash_Prefix     siem-linux-auth
    Suppress_Type_Name  On
    Trace_Error         On
    Retry_Limit         False

[OUTPUT]
    Name                opensearch
    Match               web.access
    Host                opensearch
    Port                9200
    HTTP_User           ${OS_USER}
    HTTP_Passwd         ${OS_PASSWORD}
    tls                 On
    tls.verify          Off
    Logstash_Format     On
    Logstash_Prefix     siem-web-access
    Suppress_Type_Name  On
    Trace_Error         On
    Retry_Limit         False
