# rsyslog RSYSLOG_FileFormat: 2026-11-22T09:00:00.123456+00:00 target sshd[42]: message
[PARSER]
    Name         rsyslog
    Format       regex
    Regex        ^(?<time>[^ ]+) (?<host>[^ ]+) (?<process>[^\[:]+)(?:\[(?<pid>\d+)\])?: (?<message>.*)$
    Time_Key     time
    Time_Format  %Y-%m-%dT%H:%M:%S.%L%z

# sshd: "Failed password for invalid user admin from 172.18.0.5 port 40122 ssh2"
[PARSER]
    Name    sshd_auth
    Format  regex
    Regex   ^(?<event_action>Failed|Accepted) (?<auth_method>\S+) for (?:invalid user )?(?<user_name>\S+) from (?<source_ip>\S+) port (?<source_port>\d+)
    Types   source_port:integer

[PARSER]
    Name         nginx_json
    Format       json
    Time_Key     time
    Time_Format  %Y-%m-%dT%H:%M:%S%z
